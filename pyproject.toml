[project]
name = "pps-selftrain"
version = "0.1.0"
description = "Proxy Policy Steering reproduction with a self-training loop"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gym-pusht==0.1.8",
    "gymnasium==1.4.0",
    "huggingface-hub==2.4.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "opencv-python==4.14.0.94",
    "pyarrow==26.0.1",
    "pygame==2.6.1",
    "pymunk==6.11.1",
    "shapely==2.2.0",
    "torch==2.15.0",
    "tqdm==4.70.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toy"]
